[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ear2finger"
version = "1.0.7"
description = "YouTube subtitle dictation practice — FastAPI backend and bundled React UI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hang Yin (Stephen)" }]
keywords = ["dictation", "youtube", "esl", "fastapi", "education"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
]
dependencies = [
  "fastapi==0.109.0",
  "uvicorn[standard]==0.27.0",
  "pydantic==2.5.3",
  "python-multipart==0.0.6",
  "yt-dlp==2026.2.4",
  "sqlalchemy==2.0.25",
  "aiosqlite==0.19.0",
  "passlib[bcrypt]==1.7.4",
  "python-jose[cryptography]==3.3.0",
]

[project.urls]
Homepage = "https://github.com/stephenyin/Ear2Finger"
Repository = "https://github.com/stephenyin/Ear2Finger"

[project.scripts]
ear2finger = "ear2finger.cli:main"

[project.optional-dependencies]
dev = ["build>=1.0.0", "twine>=5.0.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ear2finger = ["web/**/*"]
